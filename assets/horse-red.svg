<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
<defs>
 <linearGradient id="body" x1="0" y1="0" x2=".35" y2="1"><stop stop-color="#ffd89b"/><stop offset=".35" stop-color="#d88a49"/><stop offset=".72" stop-color="#a95b2d"/><stop offset="1" stop-color="#63301d"/></linearGradient>
 <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75402b"/><stop offset=".5" stop-color="#3a201b"/><stop offset="1" stop-color="#17131a"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ff9b83"/><stop offset=".45" stop-color="#ed343d"/><stop offset="1" stop-color="#9f1427"/></linearGradient>
 <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe5c9"/><stop offset="1" stop-color="#c98c72"/></linearGradient>
 <filter id="shade" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="drop" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
